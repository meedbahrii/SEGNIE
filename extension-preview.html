<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Segnie Extension Preview</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .extension-container {
      width: 400px;
      background: #ffffff;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      border-radius: 8px;
      overflow: hidden;
    }

    .header {
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 4px 0;
    }

    .header p {
      font-size: 13px;
      opacity: 0.9;
      margin: 0;
    }

    .content {
      padding: 20px;
    }

    .quick-save-section {
      margin-bottom: 20px;
      padding: 16px;
      background: linear-gradient(135deg, #f0f4ff 0%, #f5f3ff 100%);
      border-radius: 8px;
      border: 1px solid #e0e7ff;
    }

    .quick-save-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .quick-save-hint {
      margin-top: 8px;
      font-size: 12px;
      color: #6b7280;
      text-align: center;
    }

    .section {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #374151;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #4b5563;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .destinations {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .destination-btn {
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .destination-btn.selected {
      border-color: #667eea;
      background: #eef2ff;
    }

    .destination-icon {
      font-size: 24px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .destination-icon svg {
      width: 28px;
      height: 28px;
    }

    .destination-name {
      font-size: 12px;
      font-weight: 500;
      color: #374151;
    }

    .save-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .save-counter {
      margin-top: 12px;
      padding: 10px 12px;
      background: #f9fafb;
      border-radius: 6px;
      font-size: 12px;
      color: #4b5563;
      text-align: center;
    }

    .save-counter strong {
      color: #1f2937;
      font-weight: 600;
    }

    .quick-links {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .quick-link-btn {
      flex: 1;
      padding: 8px 12px;
      background: white;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      color: #374151;
      text-align: center;
    }

    .recent-saves {
      margin-bottom: 20px;
    }

    .recent-save-item {
      padding: 10px 12px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .recent-save-title {
      font-size: 13px;
      font-weight: 500;
      color: #1f2937;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recent-save-meta {
      font-size: 11px;
      color: #9ca3af;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="extension-container">
    <div class="header">
      <h1>Segnie</h1>
      <p>Welcome back, demo_user!</p>
    </div>

    <div class="content">
      <div class="quick-save-section">
        <button class="quick-save-btn">
          ⚡ Quick Save to Sheets
        </button>
        <div class="quick-save-hint">One-click save to your last destination</div>
      </div>

      <div class="recent-saves">
        <div class="section-title">Recent Saves</div>
        <div class="recent-save-item">
          <div class="recent-save-title">JavaScript Best Practices 2024</div>
          <div class="recent-save-meta">
            <span>Google Sheets</span>
            <span>•</span>
            <span>2h ago</span>
          </div>
        </div>
        <div class="recent-save-item">
          <div class="recent-save-title">React Component Patterns</div>
          <div class="recent-save-meta">
            <span>Notion, PDF</span>
            <span>•</span>
            <span>1d ago</span>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Manual Save</div>
        <div class="input-group">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="Enter a title..." value="Current Page Title">
        </div>
        <div class="input-group">
          <label for="content">Content</label>
          <textarea id="content" placeholder="Enter content or paste text...">Selected text from the webpage will appear here...</textarea>
        </div>
        <div class="input-group">
          <label for="content-type">Content Type</label>
          <select id="content-type">
            <option value="text">Text</option>
            <option value="article" selected>Article</option>
            <option value="quote">Quote</option>
            <option value="link">Link</option>
            <option value="image">Image</option>
            <option value="note">Note</option>
          </select>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Save to:</div>
        <div class="destinations">
          <div class="destination-btn selected">
            <div class="destination-icon">
              <svg viewBox="0 0 87.3 78" xmlns="http://www.w3.org/2000/svg">
                <path fill="#188038" d="M14 78h45.3c7.7 0 14-6.3 14-14V14c0-7.7-6.3-14-14-14H14C6.3 0 0 6.3 0 14v50c0 7.7 6.3 14 14 14z"/>
                <path fill="#fff" d="M55.3 52.7H31.3v-8.1h24v8.1zm0-12.5H31.3v-8.1h24v8.1zm0-12.5H31.3V19.6h24v8.1z"/>
                <path fill="#34a853" d="M87.3 29.8v33.4c0 7.8-6.3 14.2-14.2 14.2h-14V29.8h28.2z"/>
                <path fill="#fff" d="M74.3 52.7h-15v-8.1h15v8.1zm0-12.5h-15v-8.1h15v8.1zm0-12.5h-15V19.6h15v8.1z"/>
              </svg>
            </div>
            <div class="destination-name">Google Sheets</div>
          </div>
          <div class="destination-btn">
            <div class="destination-icon">
              <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path fill="#000" d="M6.017 4.313l55.333 -4.087c6.797 -0.583 8.543 -0.19 12.817 2.917l17.663 12.443c2.913 2.14 3.883 2.723 3.883 5.053v68.243c0 4.277 -1.553 6.807 -6.99 7.193L24.467 99.967c-4.08 0.193 -6.023 -0.39 -8.16 -3.113L3.3 79.94c-2.333 -3.113 -3.3 -5.443 -3.3 -8.167V11.113c0 -3.497 1.553 -6.413 6.017 -6.8z"/>
                <path fill="#fff" d="M61.35 0.227l-55.333 4.087C1.553 4.7 0 7.617 0 11.113v60.66c0 2.723 0.967 5.053 3.3 8.167l13.007 16.913c2.137 2.723 4.08 3.307 8.16 3.113l64.257 -3.89c5.433 -0.387 6.99 -2.917 6.99 -7.193V20.64c0 -2.21 -0.873 -2.847 -3.443 -4.733L74.167 3.143c-4.273 -3.107 -6.02 -3.5 -12.817 -2.917z"/>
              </svg>
            </div>
            <div class="destination-name">Notion</div>
          </div>
          <div class="destination-btn">
            <div class="destination-icon">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V8L14 2Z" fill="#E74C3C"/>
                <path d="M14 2V8H20" fill="#C0392B"/>
                <path d="M8 15.5C8 16.33 8.67 17 9.5 17H10.5C11.33 17 12 16.33 12 15.5V14.5C12 13.67 11.33 13 10.5 13H9.5C8.67 13 8 13.67 8 14.5V15.5Z" fill="#fff"/>
                <path d="M13 15C13 16.1 13.9 17 15 17C16.1 17 17 16.1 17 15V13H13V15Z" fill="#fff"/>
              </svg>
            </div>
            <div class="destination-name">PDF</div>
          </div>
        </div>
      </div>

      <button class="save-btn">Save Now</button>
      
      <div class="save-counter">
        Saves: <strong>23 / 50</strong>
      </div>

      <div class="quick-links">
        <a href="#" class="quick-link-btn">📊 Dashboard</a>
        <a href="#" class="quick-link-btn">🔗 Connections</a>
      </div>
    </div>
  </div>
</body>
</html>
